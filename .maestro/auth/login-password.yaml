# tags: auth
#
# Full password login via mock server (macadam-app E2E pattern).
# Disables magic link, signs in with email + password, asserts logged-in home.
#
# One-time app setup (macadam-app):
#   Add E2E_TESTING=true to .env.development, then rebuild:
#   cd ~/macadam-app && yarn android
#
# Before each run:
#   Terminal 1: cd ~/macadam-app && yarn mock-server:dev
#   Terminal 2: cd ~/macadam-app && yarn start
#   Terminal 3: ./scripts/run-login-test.sh
#
# Env (.env or -e):
#   MAESTRO_EMAIL=your-test-account@macadam.app
#   MAESTRO_PASSWORD=...

appId: ${APP_ID}
---
- runScript:
    file: ../scripts/api/healthCheck.js

- runFlow:
    file: ../subflows/login-with-mock.yaml
    env:
      APP_ID: ${APP_ID}
      MAESTRO_EMAIL: ${MAESTRO_EMAIL}
      MAESTRO_PASSWORD: ${MAESTRO_PASSWORD}

# Logged-in home — profile avatar in header
- extendedWaitUntil:
    visible:
      id: button_user_picture
    timeout: 30000
