# tags: auth
#
# What: Android — full password login via mock server.
# Run: ./scripts/run-login-test.sh

appId: ${APP_ID}
---
- runScript:
    file: ../scripts/api/healthCheck.js

- runFlow:
    file: ../subflows/login-with-mock-android.shared.yaml
    env:
      APP_ID: ${APP_ID}
      MAESTRO_EMAIL: ${MAESTRO_EMAIL}
      MAESTRO_PASSWORD: ${MAESTRO_PASSWORD}

- extendedWaitUntil:
    visible:
      id: button_user_picture
    timeout: 30000
