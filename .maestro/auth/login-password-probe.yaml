# tags: auth, probe
#
# Diagnostic with mock server: does magic_link_enabled:false work?
# Stops after email + Next — PASS if password field appears.
#
# Requires: mock-server:dev, Metro, E2E_TESTING=true build, adb reverse 4010+8081
# Run: ./scripts/run-login-probe.sh

appId: ${APP_ID}
---
- runScript:
    file: ../scripts/api/healthCheck.js

- runScript:
    file: ../scripts/api/resetScenario.js

- runScript:
    file: ../scripts/api/update-local-feature-flag.js
    env:
      maestro_flags: '{"flags":{"onb_track_notifications_enabled":true,"pre_signup_enabled":true,"personalization_enabled":true,"magic_link_enabled":false}}'

- launchApp:
    clearState: true
    # iOS-only: wipe the Keychain so the Firebase auth token doesn't survive.
    clearKeychain: true
    arguments:
      flags: '{"onb_track_notifications_enabled":true,"pre_signup_enabled":true,"personalization_enabled":true,"magic_link_enabled":false}'

- runFlow:
    file: ../subflows/dismiss-notifications-if-needed.yaml
    env:
      APP_ID: ${APP_ID}

- extendedWaitUntil:
    visible: "Get started"
    timeout: 30000
- tapOn: "Get started"
- extendedWaitUntil:
    visible:
      id: button.common.lets.go.button
    timeout: 15000
- tapOn: "I already have an account"
- tapOn:
    id: common.label.email
- inputText: ${MAESTRO_EMAIL}
- tapOn:
    id: button.common.button.next

- extendedWaitUntil:
    visible:
      id: common.label.password
    timeout: 15000

- assertVisible:
    id: common.label.password
