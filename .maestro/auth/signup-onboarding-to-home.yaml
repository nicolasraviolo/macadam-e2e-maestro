# tags: auth, signup, onboarding, regression
# qase: MACADAM-269, MACADAM-270, MACADAM-277
#
# Full new-user journey: sign-up → referral → skip health sync → full product tour → real Home.
# Also covers MACADAM-270 (product tour) and MACADAM-277 (Slomo XP gate).
#
# Health sync is intentionally skipped — see skip-health-sync-*.shared.yaml.
# Google Fit / HealthKit are not part of this test.

appId: ${APP_ID}
---
- runScript:
    file: ../scripts/api/healthCheck.js

- runFlow:
    file: ../subflows/signup-onboarding-with-mock.yaml
    env:
      APP_ID: ${APP_ID}
      MAESTRO_EMAIL: ${MAESTRO_EMAIL}
      MAESTRO_PASSWORD: ${MAESTRO_PASSWORD}

- runFlow:
    file: ../subflows/onboarding-after-signup.shared.yaml
    env:
      APP_ID: ${APP_ID}

# MACADAM-270 — product tour coach marks (steps 1–4) exercised in subflow above

# MACADAM-277 — Slomo not active until XP chip tapped
- extendedWaitUntil:
    visible:
      id: common.slomoXp.level.shortName
    timeout: 30000

- tapOn:
    id: common.slomoXp.level.shortName

- extendedWaitUntil:
    visible:
      id: slomo.onboarding.title
    timeout: 20000

- assertVisible:
    id: slomo.onboarding.title
