# tags: auth
#
# What: iOS — full password login via mock server.
# Run: FLOW=.maestro/auth/login-password-ios.yaml ./scripts/run-ios-tests.sh

appId: ${APP_ID}
---
- runScript:
    file: ../scripts/api/healthCheck.js

- runFlow:
    file: ../subflows/login-with-mock-ios.shared.yaml
    env:
      APP_ID: ${APP_ID}
      MAESTRO_EMAIL: ${MAESTRO_EMAIL}
      MAESTRO_PASSWORD: ${MAESTRO_PASSWORD}

- extendedWaitUntil:
    visible:
      id: button_user_picture
    timeout: 30000
