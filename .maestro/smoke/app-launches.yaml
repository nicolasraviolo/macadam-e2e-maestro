# tags: smoke
#
# What: Opens the Macadam beta app and checks the first screen loads.
# Why:  Confirms emulator + installed build + Maestro are wired before deeper flows.
#
# Required: app installed on device (see builds/README.md).
# Optional: -e APP_ID=... (defaults to com.macadamapp.beta via .maestro/config.yaml)
#
# TODO (app team): add testID on welcome CTA in ONBWelcomeScreen — prefer id: over text.

appId: ${APP_ID}
---
- launchApp:
    clearState: true
    # iOS-only: wipe the Keychain so a prior session's Firebase token is gone and
    # the app reliably starts at onboarding (clearState alone doesn't clear it).
    clearKeychain: true

# The onboarding ENTRY screen differs by platform (confirmed on a pristine device):
#   - Android → welcome screen ("WALK MORE EVERY DAY" + "Get started")
#   - iOS     → notifications intro ("MACADAM WORKS WITH NOTIFICATIONS" + Continue/Later)
# So we branch the first-screen assertion per platform. Deeper flows can rejoin
# once we reach shared, testID-based screens.
# TODO (app team): add a testID on the first onboarding screen(s) so this can be
# a single language/platform-independent assertion.

# --- Android: welcome screen ---
- runFlow:
    when:
      platform: Android
    commands:
      # Dev builds can cold-start slowly (~30s) after clearState.
      - extendedWaitUntil:
          visible: "Get started"
          timeout: 40000
      # Heading renders UPPERCASE on screen (RText transform); match case-insensitively.
      - assertVisible: "(?i)walk more every day"

# --- iOS: notifications intro screen ---
# On iOS the whole screen collapses into one accessibilityText blob
# ("MACADAM WORKS WITH NOTIFICATIONS. ... Continue Later") and Maestro does a
# FULL (anchored) regex match, so we must wrap the phrase in .* wildcards.
- runFlow:
    when:
      platform: iOS
    commands:
      - extendedWaitUntil:
          visible: "(?i).*works with notifications.*"
          timeout: 60000
