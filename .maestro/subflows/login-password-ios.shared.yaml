# iOS password login steps (after welcome / sign-in screen is open).
#
# Env: MAESTRO_EMAIL, MAESTRO_PASSWORD

appId: ${APP_ID}
env:
  APP_ID: ${APP_ID}
  MAESTRO_EMAIL: ${MAESTRO_EMAIL}
  MAESTRO_PASSWORD: ${MAESTRO_PASSWORD}
---
- extendedWaitUntil:
    visible: "Get started"
    timeout: 30000

- tapOn: "Get started"

- extendedWaitUntil:
    visible:
      id: button.common.lets.go.button
    timeout: 15000

- tapOn: "I already have an account"

- assertVisible:
    id: signIn.title

- tapOn:
    id: textfield.common.label.email
- inputText: ${MAESTRO_EMAIL}
- tapOn:
    id: signIn.title

- tapOn:
    id: button.common.button.next

- extendedWaitUntil:
    visible:
      id: textfield.common.label.password
    timeout: 15000
- tapOn:
    id: textfield.common.label.password
- inputText:
    text: ${MAESTRO_PASSWORD}

- tapOn:
    id: signIn.title

- scrollUntilVisible:
    element:
      id: button.signin.button
- tapOn:
    id: button.signin.button

- runScript:
    file: ../scripts/wait-for-config.js
    env:
      wait_seconds: "2"
- tapOn:
    text: "Not Now"
    optional: true
