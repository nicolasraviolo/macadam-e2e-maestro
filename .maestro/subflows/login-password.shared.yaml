# Dispatcher — prefer login-password-ios.shared.yaml or -android.shared.yaml.

appId: ${APP_ID}
env:
  APP_ID: ${APP_ID}
  MAESTRO_EMAIL: ${MAESTRO_EMAIL}
  MAESTRO_PASSWORD: ${MAESTRO_PASSWORD}
---
- runFlow:
    when:
      platform: iOS
    file: login-password-ios.shared.yaml
    env:
      APP_ID: ${APP_ID}
      MAESTRO_EMAIL: ${MAESTRO_EMAIL}
      MAESTRO_PASSWORD: ${MAESTRO_PASSWORD}

- runFlow:
    when:
      platform: Android
    file: login-password-android.shared.yaml
    env:
      APP_ID: ${APP_ID}
      MAESTRO_EMAIL: ${MAESTRO_EMAIL}
      MAESTRO_PASSWORD: ${MAESTRO_PASSWORD}
