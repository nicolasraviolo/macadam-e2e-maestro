# Shared password login (ported from macadam-app/maestro/e2e/Common/login-password.shared.yaml).
#
# Requires magic_link_enabled: false before this runs (see login-password.yaml launch flags).
#
# Env:
#   MAESTRO_EMAIL    — test account email
#   MAESTRO_PASSWORD — test account password

appId: ${APP_ID}
env:
  APP_ID: ${APP_ID}
  MAESTRO_EMAIL: ${MAESTRO_EMAIL}
  MAESTRO_PASSWORD: ${MAESTRO_PASSWORD}
---
- extendedWaitUntil:
    visible: "Get started"
    timeout: 30000

- tapOn: "Get started"

- extendedWaitUntil:
    visible:
      id: button.common.lets.go.button
    timeout: 15000

- tapOn: "I already have an account"

- assertVisible:
    id: signIn.title

# Email field: Android exposes the inner input testID (common.label.email); iOS
# exposes the wrapping container testID (textfield.common.label.email).
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn:
          id: common.label.email
      - inputText: ${MAESTRO_EMAIL}
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          id: textfield.common.label.email
      - inputText: ${MAESTRO_EMAIL}
      # On iOS the keyboard covers the "Next" button. hideKeyboard doesn't work
      # here, so tap a static text (the title) to dismiss the keyboard first.
      - tapOn:
          id: signIn.title

- tapOn:
    id: button.common.button.next

# Password screen (only when magic link is OFF). Same per-platform id difference.
- runFlow:
    when:
      platform: Android
    commands:
      - extendedWaitUntil:
          visible:
            id: common.label.password
          timeout: 15000
      - tapOn:
          id: common.label.password
      - inputText:
          text: ${MAESTRO_PASSWORD}
- runFlow:
    when:
      platform: iOS
    commands:
      - extendedWaitUntil:
          visible:
            id: textfield.common.label.password
          timeout: 15000
      - tapOn:
          id: textfield.common.label.password
      - inputText:
          text: ${MAESTRO_PASSWORD}

# Dismiss the keyboard so the sign-in button is reachable. hideKeyboard works on
# Android; on iOS it isn't supported, so tap a static text (the title) instead.
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          id: signIn.title

- scrollUntilVisible:
    element:
      id: button.signin.button
- tapOn:
    id: button.signin.button

# iOS shows a system "Save Password?" prompt after submitting credentials, which
# covers the app. Give it a moment to appear and dismiss it with "Not Now".
# Optional so the flow still passes on runs where the prompt doesn't show.
- runFlow:
    when:
      platform: iOS
    commands:
      - runScript:
          file: ../scripts/wait-for-config.js
          env:
            wait_seconds: "2"
      - tapOn:
          text: "Not Now"
          optional: true
