# Post sign-up onboarding: referral → skip health sync → product tour → real Home.
#
# Health sync is skipped (not under test here). The app exposes built-in skip paths:
#   Android — "Later" on Google Fit error, or "I don't want to count my steps"
#   iOS     — deny HealthKit, then "I don't want to count my steps"
#
# For a full health-sync journey, use onboarding-health-*.shared.yaml in a dedicated flow.

appId: ${APP_ID}
env:
  APP_ID: ${APP_ID}
---
# --- Referral code screen (both platforms) ---
- extendedWaitUntil:
    visible:
      id: referral.onboarding.submit.title
    timeout: 45000

- assertVisible:
    id: referral.onboarding.submit.title

- assertVisible:
    id: button.referral.onboarding.submit.secondarybutton

- tapOn:
    id: button.referral.onboarding.submit.secondarybutton

# --- Skip health sync (platform-specific) ---
- runFlow:
    when:
      platform: Android
    file: skip-health-sync-android.shared.yaml
    env:
      APP_ID: ${APP_ID}

- runFlow:
    when:
      platform: iOS
    file: skip-health-sync-ios.shared.yaml
    env:
      APP_ID: ${APP_ID}

# --- Product tour → real Home ---
- runFlow:
    file: onboarding-product-tour.shared.yaml
    env:
      APP_ID: ${APP_ID}
