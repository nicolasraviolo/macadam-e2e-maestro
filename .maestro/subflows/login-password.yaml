# tags: auth
#
# Password login entry point (delegates to login-with-mock subflow).
# Prefer: maestro test .maestro/auth/login-password.yaml
# Or:     ./scripts/run-login-test.sh

appId: ${APP_ID}
env:
  APP_ID: ${APP_ID}
  MAESTRO_EMAIL: ${MAESTRO_EMAIL}
  MAESTRO_PASSWORD: ${MAESTRO_PASSWORD}
---
- runFlow:
    file: login-with-mock.yaml
    env:
      APP_ID: ${APP_ID}
      MAESTRO_EMAIL: ${MAESTRO_EMAIL}
      MAESTRO_PASSWORD: ${MAESTRO_PASSWORD}

- extendedWaitUntil:
    visible:
      id: button_user_picture
    timeout: 30000
