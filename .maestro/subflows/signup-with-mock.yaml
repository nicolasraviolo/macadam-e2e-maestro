# Reusable sign-up with mock server — creates a fresh @macadam.app account.
#
# Prerequisites: same as login-with-mock.yaml (mock :4010, E2E build, Metro).
#
# Generates random credentials unless MAESTRO_EMAIL is already set.
# After this flow the app is signed in as a new user (ready for onboarding tests).

appId: ${APP_ID}
env:
  APP_ID: ${APP_ID}
  MAESTRO_EMAIL: ${MAESTRO_EMAIL}
  MAESTRO_PASSWORD: ${MAESTRO_PASSWORD}
---
- runScript:
    file: ../scripts/generate-test-account.js
    env:
      MAESTRO_EMAIL: ${MAESTRO_EMAIL}
      MAESTRO_PASSWORD: ${MAESTRO_PASSWORD}

- runScript:
    file: ../scripts/api/resetScenario.js

- runScript:
    file: ../scripts/api/update-local-feature-flag.js
    env:
      maestro_flags: '{"flags":{"onb_track_notifications_enabled":true,"pre_signup_enabled":true,"personalization_enabled":true,"magic_link_enabled":false,"onboarding_cmp_after_att":false}}'

- launchApp:
    clearState: true
    # iOS keeps the Firebase auth token in the Keychain (clearState doesn't wipe it);
    # clearKeychain ensures a logged-out start. iOS-only, ignored on Android.
    clearKeychain: true
    permissions:
      all: deny
      notifications: allow
    arguments:
      flags: '{"onb_track_notifications_enabled":true,"pre_signup_enabled":true,"personalization_enabled":true,"magic_link_enabled":false,"onboarding_cmp_after_att":false}'

- runFlow:
    when:
      platform: iOS
    file: ios-launch-warmup.shared.yaml
    env:
      APP_ID: ${APP_ID}

- runScript:
    file: ../scripts/wait-for-config.js
    env:
      wait_seconds: "4"

- runFlow:
    file: dismiss-notifications-if-needed.yaml
    env:
      APP_ID: ${APP_ID}

- runFlow:
    file: signup-presignup.shared.yaml
    env:
      APP_ID: ${APP_ID}

- runFlow:
    file: signup-credentials.shared.yaml
    env:
      APP_ID: ${APP_ID}
      MAESTRO_EMAIL: ${MAESTRO_EMAIL}
      MAESTRO_PASSWORD: ${MAESTRO_PASSWORD}
