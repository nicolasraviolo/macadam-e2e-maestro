# iOS: wait for onboarding UI, dismiss notifications slides, reach welcome screen.
# Dev builds can take 20–40s to load after clearState.

appId: ${APP_ID}
---
- runScript:
    file: ../scripts/wait-for-config.js
    env:
      wait_seconds: "8"

- extendedWaitUntil:
    visible: "(?i)(Later|Get started)"
    timeout: 60000

- repeat:
    times: 15
    while:
      notVisible: "Get started"
    commands:
      - tapOn:
          text: "Later"
          optional: true

- extendedWaitUntil:
    visible: "Get started"
    timeout: 40000
