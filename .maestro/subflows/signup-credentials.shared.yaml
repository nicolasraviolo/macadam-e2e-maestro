# Enter email + password on Signup / ChoosePassword screens.
#
# Env:
#   MAESTRO_EMAIL    — account to create
#   MAESTRO_PASSWORD — must meet app rules (default Test123!)

appId: ${APP_ID}
env:
  APP_ID: ${APP_ID}
  MAESTRO_EMAIL: ${MAESTRO_EMAIL}
  MAESTRO_PASSWORD: ${MAESTRO_PASSWORD}
---
# On iOS `hideKeyboard` isn't supported and the keyboard covers the CTAs. We dismiss
# it by tapping an empty static area via a raw COORDINATE (point) tap — importantly
# NOT the logo element: it's an animated sprite whose frame lookup throws
# kAXErrorInvalidUIElement in the XCUITest driver. A point tap needs no hierarchy
# lookup, so it's safe. Field/button testIDs are shared; only the dismiss differs.
- tapOn:
    id: textfield.email
- inputText: ${MAESTRO_EMAIL}

- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          point: "50%, 25%"

# Signup screen uses legacy Button — English label "Next"
- tapOn: "Next"

- extendedWaitUntil:
    visible: "New password"
    timeout: 15000

- tapOn:
    id: textfield.password
- inputText:
    text: ${MAESTRO_PASSWORD}

- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          point: "50%, 25%"

- scrollUntilVisible:
    element:
      text: "Confirm password"

- tapOn: "Confirm password"
- inputText:
    text: ${MAESTRO_PASSWORD}

- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          point: "50%, 25%"

- scrollUntilVisible:
    element:
      text: "Continue"
- tapOn: "Continue"
