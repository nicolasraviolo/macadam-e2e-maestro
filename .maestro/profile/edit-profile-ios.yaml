# tags: profile, auth, regression
#
# What: iOS — login → profile → edit → save → verify.
# Run: FLOW=.maestro/profile/edit-profile-ios.yaml ./scripts/run-ios-tests.sh

appId: ${APP_ID}
---
- runScript:
    file: ../scripts/api/healthCheck.js

- runFlow:
    file: ../subflows/login-with-mock-ios.shared.yaml
    env:
      APP_ID: ${APP_ID}
      MAESTRO_EMAIL: ${MAESTRO_EMAIL}
      MAESTRO_PASSWORD: ${MAESTRO_PASSWORD}

- runFlow:
    file: ../subflows/open-profile-from-tab.shared.yaml
    env:
      APP_ID: ${APP_ID}

- assertVisible: "E2E"
- assertVisible: "@e2euser"

- runFlow:
    file: ../subflows/profile-edit-fields-ios.shared.yaml
    env:
      APP_ID: ${APP_ID}
